<form (submit)="onSubmit($event)">
    <div class="my-3">
        <label>Email</label>
        <input type="text" class="form-control" [formField]="registerForm.email">
    </div>
    <div class="my-3">
        <label>Username</label>
        <input type="text" class="form-control" [formField]="registerForm.userName">
    </div>
    <div class="my-3">
        <label>Password</label>
        <input type="password" class="form-control" [formField]="registerForm.password">
    </div>
    <div class="my-3">
        <label for="role">Role</label>
        <select id="role" class="form-select" [formField]="registerForm.role">
            @for(role of roles(); track role.id) {
                <option [value]="role.name">{{ role.name }}</option>
            }
        </select>
    </div>
    @if(errors()){
        <p class="text-danger">{{errors()}}</p>
    }
    <button class="btn btn-primary" type="submit">
        Register
    </button>
</form>
