<div class="container">
    @if(id()) {
        <button (click)="backToDetails()" class="btn btn-primary mb-3">Back to Details</button>
        <h1>Edit Book</h1>
    } @else {
        <button (click)="backToBookList()" class="btn btn-primary mb-3">Back to List</button>
        <h1>Add Book</h1>
    }

    <form (submit)="onSubmit($event)">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" [formField]="bookAddForm.title" class="form-control">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" [formField]="bookAddForm.description" class="form-control"></textarea>
        </div>
        <div>
            <label for="imageUrl">Image URL</label>
            <input type="text" id="imageUrl" [formField]="bookAddForm.imageUrl" class="form-control">
        </div>
        <div class="mb-3">
            <label for="author" class="form-label">Author</label>
            <input type="text" id="author" [formField]="bookAddForm.author" class="form-control">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Publisher</label>
            <input id="description" [formField]="bookAddForm.publisher" class="form-control">
        </div>
        <div class="mb-3">
            <label for="publishedDate" class="form-label">Published Date</label>
            <input type="date" id="publishedDate" [formField]="bookAddForm.publishedDate" class="form-control">
        </div>
        <div class="mb-3">
            <label for="categories" class="form-label">Categories (ctrl + click to select multiple)</label>
            <select
                id="categories"
                class="form-control"
                name="categoryIds"
                [ngModel]="bookAddModel().categoryIds"
                (ngModelChange)="bookAddModel.update(model => ({ ...model, categoryIds: $event }))"
                multiple>
                @for(category of categories(); track category.id) {
                    <option [value]="category.id">{{ category.name }}</option>
                }
            </select>
            <div class="form-text">Selected: {{selectedCategories()?.map(category => category.name)?.join(', ')}}</div>
        </div>
        <div class="mb-3">
            <label for="pages" class="form-label">Pages</label>
            <input type="number" id="pages" [formField]="bookAddForm.pages" class="form-control">
        </div>
        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN</label>
            <input type="text" id="isbn" [formField]="bookAddForm.isbn" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary mt-3">{{id() ? "Update Book" : "Add Book"}}</button>
    </form>
</div>
