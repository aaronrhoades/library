<div class="card my-5 p-4">
    <div class="row">
        <div class="col-md-3">
            <img [src]="cartItem()?.imageUrl" class="mw-100 h-auto">
        </div>
        <div class="col-md-9">
            <h1>{{ cartItem()?.title }}</h1>
            <p>Author: {{ cartItem()?.author }}</p>
            <button (click)="removeFromCart()" class="btn btn-danger">Remove</button>
        </div>
    </div>
</div>
